<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#020617">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <title>Redefinir senha — GymCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 850: '#0f172a', 950: '#020617' } } } }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-950 text-white antialiased">
<main class="mx-auto flex min-h-screen max-w-md flex-col justify-center px-5 py-10">
    <a th:href="@{/login}" class="mb-8 inline-flex items-center gap-2 self-start text-sm font-medium text-slate-300 hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
        Voltar ao login
    </a>

    <section>
        <p class="text-xs font-semibold uppercase tracking-wider text-emerald-400">Segurança da conta</p>
        <h1 class="mt-2 text-2xl font-bold text-white">Definir nova senha</h1>

        <p th:if="${mensagemErro}" role="alert" class="mt-5 rounded-lg border border-red-500/20 bg-red-500/10 px-4 py-3 text-sm text-red-300" th:text="${mensagemErro}">O link é inválido ou expirou.</p>

        <div th:if="${!tokenValido}" class="mt-5 rounded-xl border border-white/10 bg-slate-900/70 p-4">
            <p th:if="${mensagemErro == null}" class="text-sm text-slate-300">Este link é inválido ou expirou. Solicite uma nova recuperação.</p>
            <a th:href="@{/recuperar-senha}" class="mt-4 inline-flex rounded-lg bg-emerald-500 px-4 py-2.5 text-sm font-semibold text-slate-950 hover:bg-emerald-400">Solicitar novo link</a>
        </div>

        <form th:if="${tokenValido}" th:action="@{/redefinir-senha}" method="post" class="mt-6 flex flex-col gap-4" data-loading-form>
            <input type="hidden" name="token" th:value="${token}">
            <div class="flex flex-col gap-1.5">
                <label for="novaSenha" class="text-xs font-medium text-slate-300">Nova senha</label>
                <input id="novaSenha" name="novaSenha" type="password" autocomplete="new-password" minlength="6" required class="w-full rounded-lg border-0 bg-slate-900 px-3.5 py-3 text-sm text-white ring-1 ring-inset ring-white/10 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div class="flex flex-col gap-1.5">
                <label for="confirmarSenha" class="text-xs font-medium text-slate-300">Confirmar nova senha</label>
                <input id="confirmarSenha" name="confirmarSenha" type="password" autocomplete="new-password" minlength="6" required class="w-full rounded-lg border-0 bg-slate-900 px-3.5 py-3 text-sm text-white ring-1 ring-inset ring-white/10 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <button type="submit" data-loading-submit data-loading-text="Salvando..." class="rounded-lg bg-emerald-500 px-4 py-3 text-sm font-semibold text-slate-950 transition-colors hover:bg-emerald-400">Salvar nova senha</button>
        </form>
    </section>
</main>
<script th:src="@{/js/gymcheck.js}" defer></script>
</body>
</html>
