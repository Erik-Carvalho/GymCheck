<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymCheck - Medidas Corporais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-activity"></i> GymCheck</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house-door"></i> Início</a></li>
                <li class="nav-item"><a class="nav-link" href="/treinos"><i class="bi bi-journal-check"></i> Treinos</a></li>
                <li class="nav-item"><a class="nav-link" href="/dieta"><i class="bi bi-egg-fried"></i> Dieta</a></li>
                <li class="nav-item"><a class="nav-link active" href="/medidas"><i class="bi bi-rulers"></i> Medidas</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4">
    <!-- Botão de Voltar ao Menu Principal -->
    <a href="/" class="btn btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left"></i> Voltar ao Menu Principal
    </a>

    <div class="row g-4">
        <!-- Formulário de Medidas -->
        <div class="col-md-5">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-bold py-3">
                    <i class="bi bi-plus-circle text-primary me-2"></i> Registrar Nova Medida
                </div>
                <div class="card-body">
                    <form th:action="@{/medidas}" th:object="${medida}" method="post">
                        <div class="mb-3">
                            <label for="data" class="form-label">Data do Registo</label>
                            <input type="date" class="form-control" id="data" th:field="*{data}" required>
                        </div>
                        <div class="mb-3">
                            <label for="pesoKg" class="form-label">Peso (kg)</label>
                            <input type="number" step="0.1" class="form-control" id="pesoKg" th:field="*{pesoKg}" placeholder="Ex: 75.5" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="cinturaCm" class="form-label">Cintura (cm)</label>
                                <input type="number" step="0.1" class="form-control" id="cinturaCm" th:field="*{cinturaCm}" placeholder="Ex: 80">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="bracoCm" class="form-label">Braço (cm)</label>
                                <input type="number" step="0.1" class="form-control" id="bracoCm" th:field="*{bracoCm}" placeholder="Ex: 35">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">
                            <i class="bi bi-check-lg me-1"></i> Salvar Medidas
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tabela do Histórico de Medidas -->
        <div class="col-md-7">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-bold py-3">
                    <i class="bi bi-rulers text-primary me-2"></i> Histórico de Evolução
                </div>
                <div class="card-body p-0">
                    <div th:if="${medidas == null or medidas.empty}" class="text-muted text-center py-4">
                        Nenhuma medida corporais registrada até ao momento.
                    </div>

                    <table class="table table-hover align-middle mb-0" th:if="${medidas != null and !medidas.empty}">
                        <thead class="table-light">
                        <tr>
                            <th>Data</th>
                            <th class="text-center">Peso (kg)</th>
                            <th class="text-center">Cintura (cm)</th>
                            <th class="text-center">Braço (cm)</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="m : ${medidas}">
                            <td class="fw-bold" th:text="${#temporals.format(m.data, 'dd/MM/yyyy')}">01/01/2026</td>
                            <td class="text-center text-primary fw-bold" th:text="${m.pesoKg + ' kg'}">75.0 kg</td>
                            <td class="text-center" th:text="${m.cinturaCm != null ? m.cinturaCm + ' cm' : '-'}">80 cm</td>
                            <td class="text-center" th:text="${m.bracoCm != null ? m.bracoCm + ' cm' : '-'}">35 cm</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
