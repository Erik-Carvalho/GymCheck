<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymCheck - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="card shadow border-0 p-4" style="width: 380px;">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary"><i class="bi bi-activity"></i> GymCheck</h2>
        <p class="text-muted">Acesse sua conta para continuar</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger p-2 small text-center">E-mail ou senha inválidos.</div>
    <div th:if="${param.logout}" class="alert alert-info p-2 small text-center">Você saiu da sua conta.</div>
    <div th:if="${param.cadastrado}" class="alert alert-success p-2 small text-center">Cadastro realizado! Faça login.</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" name="username" class="form-control" required placeholder="seu@email.com">
        </div>
        <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" name="password" class="form-control" required placeholder="******">
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold">Entrar</button>
    </form>

    <div class="text-center mt-3">
        <a href="/cadastro" class="text-decoration-none">Ainda não tem conta? Cadastre-se</a>
    </div>
</div>
</body>
</html>
