<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymCheck - Registo de Dieta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-activity"></i> GymCheck</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house-door"></i> Início</a></li>
                <li class="nav-item"><a class="nav-link" href="/treinos"><i class="bi bi-journal-check"></i> Treinos</a></li>
                <li class="nav-item"><a class="nav-link active" href="/dieta"><i class="bi bi-egg-fried"></i> Dieta</a></li>
                <li class="nav-item"><a class="nav-link" href="/medidas"><i class="bi bi-rulers"></i> Medidas</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4">
    <!-- Botão de Voltar ao Menu Principal -->
    <a href="/" class="btn btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left"></i> Voltar ao Menu Principal
    </a>

    <div class="row g-4">
        <!-- Form de Registo de Refeição -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-bold py-3">
                    <i class="bi bi-plus-circle text-success me-2"></i> Registrar Refeição
                </div>
                <div class="card-body">
                    <form th:action="@{/dieta}" th:object="${refeicao}" method="post">
                        <div class="mb-3">
                            <label for="nomeRefeicao" class="form-label">Nome da Refeição</label>
                            <input type="text" class="form-control" id="nomeRefeicao" th:field="*{nomeRefeicao}" placeholder="Ex: Almoço, Café da Manhã" required>
                        </div>
                        <div class="mb-3">
                            <label for="horario" class="form-label">Horário</label>
                            <input type="time" class="form-control" id="horario" th:field="*{horario}" required>
                        </div>
                        <div class="mb-3">
                            <label for="descricaoAlimentos" class="form-label">Alimentos / Descrição</label>
                            <textarea class="form-control" id="descricaoAlimentos" th:field="*{descricaoAlimentos}" rows="3" placeholder="Ex: 200g Frango, 150g Arroz, Salada" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold">
                            <i class="bi bi-check-lg me-1"></i> Salvar Refeição
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tabela do Histórico de Refeições -->
        <div class="col-md-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-bold py-3">
                    <i class="bi bi-egg-fried text-success me-2"></i> Refeições Registradas Hoje
                </div>
                <div class="card-body p-0">
                    <div th:if="${refeicoes == null or refeicoes.empty}" class="text-muted text-center py-4">
                        Nenhuma refeição registrada para o dia de hoje.
                    </div>

                    <table class="table table-hover align-middle mb-0" th:if="${refeicoes != null and !refeicoes.empty}">
                        <thead class="table-light">
                        <tr>
                            <th>Horário</th>
                            <th>Refeição</th>
                            <th>Alimentos</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="ref : ${refeicoes}">
                            <td><span class="badge bg-secondary" th:text="${ref.horario}">12:00</span></td>
                            <td class="fw-bold" th:text="${ref.nomeRefeicao}">Almoço</td>
                            <td class="text-muted" th:text="${ref.descricaoAlimentos}">200g de Frango, Arroz</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
