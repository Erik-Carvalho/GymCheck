<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#020617">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <title>Recuperar senha — GymCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 850: '#0f172a', 950: '#020617' } } } }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-950 text-white antialiased">
<main class="mx-auto flex min-h-screen max-w-md flex-col justify-center px-5 py-10">
    <a th:href="@{/login}" class="mb-8 inline-flex items-center gap-2 self-start text-sm font-medium text-slate-300 hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
        Voltar ao login
    </a>

    <section>
        <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-emerald-500/10 text-emerald-400 ring-1 ring-inset ring-emerald-500/20">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>
        <h1 class="mt-5 text-2xl font-bold text-white">Recuperar senha</h1>
        <p class="mt-2 text-sm leading-relaxed text-slate-400">Informe o e-mail da sua conta. Se ele estiver cadastrado, enviaremos um link válido por 30 minutos.</p>

        <div th:if="${mensagemSucesso}" role="status" class="mt-5 rounded-lg border border-emerald-500/20 bg-emerald-500/10 px-4 py-3 text-sm text-emerald-300" th:text="${mensagemSucesso}">Se o e-mail estiver cadastrado, você receberá um link.</div>

        <form th:action="@{/recuperar-senha}" method="post" class="mt-6 flex flex-col gap-4" data-loading-form>
            <div class="flex flex-col gap-1.5">
                <label for="email" class="text-xs font-medium text-slate-300">E-mail</label>
                <input id="email" name="email" type="email" autocomplete="email" required placeholder="seu@email.com" class="w-full rounded-lg border-0 bg-slate-900 px-3.5 py-3 text-sm text-white ring-1 ring-inset ring-white/10 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <button type="submit" data-loading-submit data-loading-text="Enviando..." class="rounded-lg bg-emerald-500 px-4 py-3 text-sm font-semibold text-slate-950 transition-colors hover:bg-emerald-400">Enviar link de recuperação</button>
        </form>
    </section>
</main>
<script th:src="@{/js/gymcheck.js}" defer></script>
</body>
</html>
