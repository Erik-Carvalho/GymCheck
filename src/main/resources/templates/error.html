<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <title>GymCheck — Página Não Encontrada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#0f172a',
                            950: '#020617'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-white antialiased break-words whitespace-normal">
    <div class="min-h-screen bg-slate-950 text-white">
        <main class="relative mx-auto flex min-h-screen max-w-md flex-col justify-between bg-gradient-to-b from-slate-900 to-slate-950 px-6 py-10">

            <!-- Top Slogan -->
            <div class="text-center">
                <span class="inline-flex items-center gap-1.5 rounded-full bg-indigo-500/10 px-3.5 py-1 text-xs font-semibold uppercase tracking-wider text-indigo-400 ring-1 ring-inset ring-indigo-500/20">
                    Treine. Registe. Evolua.
                </span>
            </div>

            <!-- Centro do Erro -->
            <div class="my-auto flex flex-col items-center text-center">
                <div class="relative flex h-20 w-20 items-center justify-center rounded-3xl bg-gradient-to-br from-indigo-500/20 to-blue-600/20 p-4 ring-1 ring-indigo-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                </div>

                <div class="mt-6 flex items-center gap-2">
                    <span class="rounded-lg bg-slate-800/80 px-2.5 py-1 text-xs font-mono font-semibold text-slate-400 ring-1 ring-white/10"
                          th:text="${status != null ? 'Status ' + status : 'Erro'}">
                        Status 404
                    </span>
                </div>

                <h1 class="mt-4 text-2xl font-bold tracking-tight text-white">
                    Ops! Algo deu errado
                </h1>

                <p class="mt-2 text-sm text-slate-400 max-w-xs leading-relaxed"
                   th:text="${status == 404 ? 'A página solicitada não foi encontrada.' : 'Ocorreu uma falha temporária no processamento. Tente novamente.'}">
                    A página solicitada não foi encontrada ou ocorreu uma falha temporária no processamento.
                </p>

                <div class="mt-8 flex w-full flex-col gap-3">
                    <a th:href="@{/}"
                       class="flex items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-indigo-500 to-blue-600 px-4 py-3.5 text-sm font-semibold text-white shadow-lg shadow-indigo-500/25 transition-opacity hover:opacity-95 active:opacity-90">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                        Voltar ao Início
                    </a>

                    <button type="button" onclick="window.history.back()"
                            class="flex items-center justify-center gap-2 rounded-xl bg-slate-800/60 px-4 py-3 text-sm font-medium text-slate-300 ring-1 ring-white/5 transition-colors hover:bg-slate-800 active:bg-slate-700">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"/>
                        </svg>
                        Voltar à Página Anterior
                    </button>
                </div>
            </div>

            <!-- Rodapé -->
            <div th:replace="~{fragments/footer :: appFooter}"></div>
        </main>
    </div>

    <script th:src="@{/js/gymcheck.js}" defer></script>
</body>
</html>
