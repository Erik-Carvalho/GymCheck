<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco de Exercícios - GymCheck</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container my-4">
    <a href="/treinos" class="btn btn-sm btn-outline-secondary mb-3"><i class="bi bi-arrow-left"></i> Voltar para Rotinas</a>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm p-3">
                <h5 class="mb-3">Cadastrar Novo Exercício</h5>
                <form th:action="@{/treinos/exercicios/salvar}" th:object="${novoExercicio}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Nome do Exercício</label>
                        <input type="text" class="form-control" th:field="*{nome}" required placeholder="Ex: Agachamento Livre">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Grupo Muscular</label>
                        <input type="text" class="form-control" th:field="*{grupoMuscular}" required placeholder="Ex: Quadríceps">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Peso Inicial (kg)</label>
                        <input type="number" step="0.5" class="form-control" th:field="*{pesoInicialKg}" placeholder="0.0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Peso Atual (kg)</label>
                        <input type="number" step="0.5" class="form-control" th:field="*{pesoAtualKg}" placeholder="0.0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Recorde Pessoal - PR (kg)</label>
                        <input type="number" step="0.5" class="form-control" th:field="*{recordePessoalKg}" placeholder="0.0">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Salvar Exercício</button>
                </form>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-bold py-3">Banco de Exercícios Cadastrados</div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Exercício</th>
                            <th>Grupo Muscular</th>
                            <th>Peso Inicial</th>
                            <th>Peso Atual</th>
                            <th>PR (Máximo)</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="ex : ${exercicios}">
                            <td class="fw-bold" th:text="${ex.nome}">Supino Reto</td>
                            <td><span class="badge bg-secondary" th:text="${ex.grupoMuscular}">Peito</span></td>
                            <td th:text="${ex.pesoInicialKg + ' kg'}">50.0 kg</td>
                            <td class="fw-bold text-success" th:text="${ex.pesoAtualKg + ' kg'}">80.0 kg</td>
                            <td class="fw-bold text-primary" th:text="${ex.recordePessoalKg + ' kg'}">100.0 kg</td>
                        </tr>
                        <tr th:if="${exercicios == null or exercicios.empty}">
                            <td colspan="5" class="text-center text-muted py-3">Nenhum exercício cadastrado.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
