<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <title>Novo Exercício - GymCheck</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light" style="overflow-wrap: break-word; white-space: normal;">
<div class="container my-5" style="max-width: 600px;">
    <div class="card border-0 shadow-sm p-4">
        <h3 class="mb-4">Cadastrar Exercício</h3>
        <form th:action="@{/treinos/exercicios/salvar}" th:object="${exercicio}" method="post" data-loading-form>
            <div class="mb-3">
                <label class="form-label">Nome do Exercício</label>
                <input type="text" class="form-control" th:field="*{nome}" required placeholder="Ex: Agachamento Livre">
            </div>
            <div class="mb-3">
                <label class="form-label">Grupo Muscular</label>
                <input type="text" class="form-control" th:field="*{grupoMuscular}" required placeholder="Ex: Peitoral, Dorsal, Quadríceps">
            </div>
            <div class="mb-3">
                <label class="form-label">Carga Inicial / PR (kg)</label>
                <input type="number" step="0.5" class="form-control" th:field="*{maiorPesoPegoKg}" placeholder="0.0">
            </div>
            <div class="mb-3">
                <label class="form-label">Observações</label>
                <textarea class="form-control" th:field="*{observacoes}" rows="2" placeholder="Dicas de execução..."></textarea>
            </div>
            <div class="d-flex justify-content-between">
                <a href="/treinos" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" data-loading-submit data-loading-text="Salvando exercício..." class="btn btn-primary">Salvar Exercício</button>
            </div>
        </form>
    </div>
</div>
<div th:replace="~{fragments/footer :: appFooter}"></div>
    <script th:src="@{/js/gymcheck.js}" defer></script>
</body>
</html>
