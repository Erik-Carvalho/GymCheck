<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymCheck - Gerenciar Treinos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-activity"></i> GymCheck</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house-door"></i> Início</a></li>
                <li class="nav-item"><a class="nav-link active" href="/treinos"><i class="bi bi-journal-check"></i> Treinos</a></li>
                <li class="nav-item"><a class="nav-link" href="/dieta"><i class="bi bi-egg-fried"></i> Dieta</a></li>
                <li class="nav-item"><a class="nav-link" href="/medidas"><i class="bi bi-rulers"></i> Medidas</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4">
    <!-- Botão de Voltar ao Menu Principal -->
    <a href="/" class="btn btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left"></i> Voltar ao Menu Principal
    </a>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold"><i class="bi bi-journal-check text-primary me-2"></i> Rotinas de Treino</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNovaRotina">
            <i class="bi bi-plus-lg me-1"></i> Nova Rotina
        </button>
    </div>

    <div class="row g-4">
        <div class="col-md-12" th:if="${rotinas == null or rotinas.empty}">
            <div class="card border-0 shadow-sm text-center py-5">
                <div class="card-body">
                    <i class="bi bi-journal-x display-1 text-muted mb-3"></i>
                    <h4>Nenhuma rotina cadastrada</h4>
                    <p class="text-muted">Crie a sua primeira rotina de treino para começar a adicionar os exercícios.</p>
                </div>
            </div>
        </div>

        <div class="col-md-4" th:each="r : ${rotinas}">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <h4 class="card-title fw-bold text-primary" th:text="${r.nome}">Treino A</h4>
                        <p class="card-text text-muted" th:text="${r.descricao}">Descrição da rotina de treino...</p>
                    </div>
                    <div class="mt-4">
                        <a th:href="@{'/treinos/rotinas/' + ${r.id}}" class="btn btn-outline-primary w-100 fw-bold">
                            <i class="bi bi-gear me-1"></i> Gerenciar Exercícios
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal para Criar Nova Rotina -->
<div class="modal fade" id="modalNovaRotina" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Criar Nova Rotina</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/treinos/nova}" th:object="${novaRotina}" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome da Rotina</label>
                        <input type="text" class="form-control" id="nome" th:field="*{nome}" placeholder="Ex: Treino A - Peito e Tríceps" required>
                    </div>
                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição / Observação</label>
                        <textarea class="form-control" id="descricao" th:field="*{descricao}" rows="3" placeholder="Ex: Foco em hipertrofia"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Rotina</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
