<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymCheck - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="card shadow border-0 p-4" style="width: 380px;">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-success"><i class="bi bi-person-plus"></i> Nova Conta</h2>
        <p class="text-muted">Crie sua conta no GymCheck</p>
    </div>

    <form th:action="@{/cadastro}" method="post">
        <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" name="email" class="form-control" required placeholder="seu@email.com">
        </div>
        <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" name="senha" class="form-control" required placeholder="Crie uma senha">
        </div>
        <button type="submit" class="btn btn-success w-100 fw-bold mb-2">Cadastrar</button>
        <a href="/login" class="btn btn-outline-secondary w-100">Voltar ao Login</a>
    </form>
</div>
</body>
</html>
